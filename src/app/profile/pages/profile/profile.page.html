<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="profile-container">

    <!-- Avatar Section -->
    <div class="avatar-section">
      <div class="avatar-wrapper">
        <ion-avatar class="profile-avatar">
          <img src="assets/avatar.png" alt="Profile picture" />
        </ion-avatar>
        <div class="verified-badge">
          <ion-icon name="checkmark"></ion-icon>
        </div>
      </div>
      <h2 class="profile-name">Gerardo Perez</h2>
      <p class="join-date">Se unió hace 2 semanas</p>
    </div>

    <!-- Profile Info -->
    <ion-list class="profile-list">

      <ion-item lines="none" class="profile-item">
        <div class="icon-wrapper purple">
          <ion-icon name="person-outline"></ion-icon>
        </div>
        <div class="item-content">
          <ion-label class="item-label">Nombre completo</ion-label>
          <p class="item-value">Gerardo Perez</p>
        </div>
      </ion-item>

      <ion-item lines="none" class="profile-item">
        <div class="icon-wrapper yellow">
          <ion-icon name="card-outline"></ion-icon>
        </div>
        <div class="item-content">
          <ion-label class="item-label">Número de identidad</ion-label>
          <p class="item-value">0501199700232</p>
        </div>
      </ion-item>

      <ion-item lines="none" class="profile-item">
        <div class="icon-wrapper teal">
          <ion-icon name="call-outline"></ion-icon>
        </div>
        <div class="item-content">
          <ion-label class="item-label">Número de teléfono</ion-label>
          <p class="item-value">32323232</p>
        </div>
      </ion-item>

      <ion-item lines="none" class="profile-item">
        <div class="icon-wrapper green">
          <ion-icon name="mail-outline"></ion-icon>
        </div>
        <div class="item-content">
          <ion-label class="item-label">Correo electrónico</ion-label>
          <p class="item-value">usuario@gmail.com</p>
        </div>
      </ion-item>

    </ion-list>

    <!-- Save Button -->
    <ion-button
      expand="block"
      class="save-button">
      Guardar
    </ion-button>

    <!-- Logout Button -->
    <ion-button
      expand="block"
      fill="outline"
      class="logout-button">
      Cerrar sesión
    </ion-button>

  </div>
</ion-content>
